[build]
  publish = "."

# ── Domain redirects ────────────────────────────────────────────────────────
# Once a custom domain is connected in the Netlify dashboard, mirror the
# windows4u pattern here: 301-redirect http:// and www. variants to the
# canonical https://apex-domain/*. Left out for now since the domain isn't
# decided yet (Netlify's own dashboard "Primary domain" setting can also
# handle this without any redirect rules here).

# ── Security & caching headers ───────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options              = "SAMEORIGIN"
    X-Content-Type-Options       = "nosniff"
    Referrer-Policy              = "strict-origin-when-cross-origin"
    Permissions-Policy           = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security    = "max-age=63072000; includeSubDomains; preload"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/style.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"
